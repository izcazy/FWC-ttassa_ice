<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            width: 50%;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: #b7c478;">First cell</td>
            <td style="background-color: #f8b8a5;">Second cell</td>
        </tr>
    </table>
</body>
</html>
