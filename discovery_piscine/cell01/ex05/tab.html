<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 20px;
            height: 100px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: #b7c478;">First cell</td>
            <td style="background-color: #f8b8a5;">Second cell</td>
        </tr>
    </table>
</body>
</html>
